<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RF4 Recipe Viewer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div id="app">
        <div id="search-screen" class="screen active">
            <header>
                <h2>Recipe Search</h2>
                <div>
                    <button id="reset-btn">Clear</button>
                    <button id="toggle-loadout-btn">☰</button>
                </div>
            </header>

            <div class="filter-bar">
                <select id="skill-filter">
                    <option value="All">All Skills</option>
                </select>
                <select id="subtype-filter">
                    <option value="All">All Subtypes</option>
                </select>
            </div>
            
            <div class="matrix-container">
                <div class="grid-2x3" id="input-grid"></div>
            </div>

            <div id="results-container">
                <ul id="recipe-list"></ul>
            </div>
        </div>

        <div id="recipe-screen" class="screen">
            <header>
                <button id="back-btn">⬅ Back</button>
                <h2 id="detail-title" style="flex:1; text-align:right;">Recipe Details</h2>
                <button id="equip-btn" style="display:none; margin-left:10px;">Equip</button>
            </header>
            <div class="matrix-container">
                <div class="grid-2x3" id="detail-grid"></div>
            </div>
            <div id="stats-container" class="stats-container"></div>
        </div>
        
        <!-- Loadout Sidebar Overlay -->
        <div id="loadout-overlay" class="loadout-overlay"></div>
        <div id="loadout-sidebar" class="loadout-sidebar">
            <div class="loadout-header">
                <h2>Loadout</h2>
                <button id="close-loadout-btn">X</button>
            </div>
            <div class="loadout-actions">
                <button id="share-loadout-btn">Copy Code</button>
                <button id="import-loadout-btn">Import</button>
            </div>
            <div id="loadout-slots" class="loadout-slots">
                <!-- Slots will be injected here by JS -->
            </div>
            <div id="loadout-stats" class="loadout-stats">
                <h3>Total Stats</h3>
                <div id="loadout-stats-grid" class="stats-grid"></div>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js', { scope: './' })
                    .catch(err => console.log('SW fail', err));
            });
        }
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
