<div id="search-screen" class="screen active">
    <header>
        <h2>Recipe Search</h2>
        <div>
            <button id="reset-btn">Clear</button>
            <button id="toggle-nav-search-btn">☰</button>
        </div>
    </header>

    <div class="filter-bar">
        <select id="skill-filter">
            <option value="All">All Skills</option>
        </select>
        <select id="subtype-filter">
            <option value="All">All Subtypes</option>
        </select>
    </div>
    
    <div class="matrix-container">
        <div class="grid-2x3" id="input-grid"></div>
    </div>

    <div id="results-container">
        <ul id="recipe-list"></ul>
    </div>
</div>

<div id="recipe-screen" class="screen">
    <header>
        <button id="back-btn">⬅ Back</button>
        <h2 id="detail-title" style="flex:1; text-align:right;">Recipe Details</h2>
        <button id="equip-btn" style="display:none; margin-left:10px;">Equip</button>
    </header>
    <div class="matrix-container">
        <div class="grid-2x3" id="detail-grid"></div>
    </div>
    <div id="stats-container" class="stats-container"></div>
</div>

<!-- New Loadout Screen -->
<div id="loadout-screen" class="screen">
    <header>
        <h2>Loadout Editor</h2>
        <button id="toggle-nav-loadout-btn">☰</button>
    </header>
    <div class="loadout-actions">
        <button id="share-loadout-btn">Copy Code</button>
        <button id="import-loadout-btn">Import</button>
    </div>
    <div id="loadout-slots" class="loadout-slots">
        <!-- Slots will be injected here by JS -->
    </div>
    <div id="loadout-stats" class="loadout-stats">
        <h3>Total Stats</h3>
        <div id="loadout-stats-grid" class="stats-grid"></div>
    </div>
</div>

<!-- Navigation Sidebar Overlay -->
<div id="nav-overlay" class="loadout-overlay"></div>
<div id="nav-sidebar" class="loadout-sidebar">
    <div class="loadout-header">
        <h2>Menu</h2>
        <button id="close-nav-btn">X</button>
    </div>
    <div class="nav-links" style="display: flex; flex-direction: column; padding: 15px; gap: 10px;">
        <button id="nav-recipe-viewer" style="padding: 10px; font-size: 16px;">Recipe Viewer</button>
        <button id="nav-loadout-editor" style="padding: 10px; font-size: 16px;">Loadout Editor</button>
    </div>
</div>
